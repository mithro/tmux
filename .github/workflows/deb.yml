name: Build deb + publish apt repo

# Builds the welland tmux deb (pinned next-3.8 snapshot) on a native arm64
# runner so it installs on the ten64s (Ten64 routers, arm64).

on:
  push:
    branches: [mithro/welland]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates git dpkg-dev debhelper \
            autoconf automake autotools-dev pkgconf bison \
            libevent-dev libncurses-dev python3

      - uses: actions/checkout@v4
        with:
          ref: mithro/welland
          fetch-depth: 0

      - name: Trust repo directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set changelog version from the pinned commit
        run: python3 packaging/deb-version.py --write-changelog

      - name: Show what we are building
        run: |
          echo "source HEAD: $(git rev-parse --short HEAD)"
          echo "version:     $(dpkg-parsechangelog -S Version)"

      - name: Build package (binary-only, arm64)
        run: dpkg-buildpackage -b -us -uc

      - name: Collect debs
        run: |
          mkdir -p built-debs
          cp ../*.deb built-debs/
          ls -l built-debs/

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: built-debs/

  publish-apt:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          merge-multiple: true
          path: apt-repo/

      - name: Generate apt repo metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils
          cd apt-repo
          dpkg-scanpackages --multiversion . > Packages
          gzip -k Packages
          cat > Release <<EOF
          Origin: mithro-tmux
          Label: mithro-tmux
          Suite: stable
          Codename: trixie
          Architectures: amd64 arm64 all
          Components: main
          Description: tmux next-3.8 snapshot (fixes choose-tree blank-tree bug)
          EOF
          apt-ftparchive release . >> Release

      - name: Sign repo
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd apt-repo
          gpg --batch --yes --armor --detach-sign --output Release.gpg Release
          gpg --batch --yes --armor --clearsign --output InRelease Release
          gpg --batch --yes --armor --export > tmux.gpg

      - name: Create index page
        run: |
          cat > apt-repo/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html><head><title>mithro tmux apt repository</title></head>
          <body>
          <h1>mithro tmux apt repository</h1>
          <p>A pinned snapshot of upstream tmux <b>next-3.8</b> (commit 5ed5e36),
          which fixes the 3.7b <code>choose-tree</code> blank-tree bug with
          grouped sessions. arm64.</p>
          <h2>Setup</h2>
          <pre>
          curl -fsSL https://mithro.github.io/tmux/tmux.gpg \
            | sudo tee /etc/apt/keyrings/mithro-tmux.gpg > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/mithro-tmux.gpg] https://mithro.github.io/tmux/ ./" \
            | sudo tee /etc/apt/sources.list.d/mithro-tmux.list
          sudo apt update
          sudo apt install tmux
          </pre>
          </body></html>
          HTMLEOF
          sed -i 's/^          //' apt-repo/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apt-repo/
      - id: deploy
        uses: actions/deploy-pages@v4
