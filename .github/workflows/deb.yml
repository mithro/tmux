name: Build deb + publish apt repo

# Builds the welland tmux deb (pinned next-3.8 snapshot) for trixie and sid on
# amd64, arm64, armhf and riscv64, then publishes a GPG-signed flat apt repo per
# suite to GitHub Pages. armhf and riscv64 are emulated.

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

# A reusable workflow cannot escalate beyond the permissions its caller holds,
# so the Pages permissions the publish job needs are granted here.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deb:
    name: deb (${{ matrix.suite }} ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, sid]
        # riscv64 is an official Debian architecture from trixie onwards, so it
        # is available for every suite built here.
        arch: [amd64, arm64, armhf, riscv64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so deb-version.py can describe

      - uses: mithro/apt-repo-action/build-deb@main
        with:
          suite: ${{ matrix.suite }}
          arch: ${{ matrix.arch }}
          build-deps: >-
            autoconf automake autotools-dev pkgconf bison libevent-dev libncurses-dev libjemalloc-dev libsystemd-dev

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: built-debs/*.deb
          if-no-files-found: error

  publish-apt:
    # Build on PRs to validate, but never publish from one.
    if: github.event_name != 'pull_request'
    needs: build-deb
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "trixie sid"
      architectures: "amd64 arm64 armhf riscv64"
      origin: tmux
      description: "tmux terminal multiplexer (mithro build)"
      keyring-name: tmux.gpg
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
